name: Agent Proof release gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agentproof/**'
      - 'packs/**'
      - 'tests/**'
      - '.github/workflows/agent-proof-gate.yml'

jobs:
  deployment-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Prove Agent Trust Audit dogfood pack readiness
        run: >-
          agentproof audit-check support-ops-trust-audit-v1
          --min-cases 30
          --output audit-readiness.json
      - name: Run Agent Trust Audit dogfood deployment gate
        run: >-
          agentproof gate support-ops-trust-audit-v1
          --provider demo_candidate
          --name "Audit dogfood candidate"
          --min-success 0.95
          --max-critical 0
          --output audit-dogfood-run.json
          --github-summary
      - name: Run approved baseline
        run: >-
          agentproof run support-ops-v1
          --provider demo_baseline
          --name "Approved baseline"
          --output baseline-run.json
      - name: Run candidate deployment gate
        run: >-
          agentproof gate support-ops-v1
          --provider demo_candidate
          --name "Candidate"
          --min-success 0.95
          --max-critical 0
          --output candidate-run.json
          --github-summary
      - name: Require paired regression improvement
        run: >-
          agentproof compare baseline-run.json candidate-run.json
          --require-promote
          --output comparison.json
          --github-summary
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: agent-proof-evidence
          path: |
            baseline-run.json
            candidate-run.json
            comparison.json
            audit-readiness.json
            audit-dogfood-run.json
