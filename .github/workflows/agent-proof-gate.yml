name: Agent Proof release gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agentproof/**'
      - 'packs/**'
      - '.github/workflows/agent-proof-gate.yml'

jobs:
  deployment-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - name: Run candidate deployment gate
        run: >-
          agentproof gate support-ops-v1
          --provider demo_candidate
          --min-success 0.95
          --max-critical 0
          --output candidate-run.json
          --github-summary
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-proof-evidence
          path: candidate-run.json
