name: ASTRA pilot controls
on:
  pull_request:
    paths: ['pilots/astra/**', '.github/workflows/astra-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test controls and measurement contract
        run: python -m unittest discover -s pilots/astra -p 'test_*.py' -v
      - name: Verify regression sensitivity
        run: python pilots/astra/mutation_check.py
      - name: Replay scripted controls
        run: python pilots/astra/control_room.py demo
      - name: Build interactive evidence snapshot
        run: python pilots/astra/control_room.py render
      - uses: actions/upload-artifact@v4
        with:
          name: astra-pilot-evidence
          path: |
            pilots/astra/evidence/
            pilots/astra/control-room.html
