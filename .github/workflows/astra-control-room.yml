name: ASTRA control-room contracts
on:
  pull_request:
    paths:
      - 'agentproof/controlroom*.py'
      - 'tests/test_controlroom.py'
      - '.github/workflows/astra-control-room.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=evidence/astra-tests.xml
      - run: python -m agentproof.controlroom demo --output evidence/astra-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-evidence-${{ github.sha }}
          path: evidence/
